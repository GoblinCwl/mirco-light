<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark"><title>微光集 · 评论回复</title>
<style>
body{margin:0;padding:0}table{border-collapse:collapse}.mail-copy{overflow-wrap:anywhere;word-break:break-word}.mail-copy p{margin:0 0 12px}.mail-copy p:last-child{margin-bottom:0}.mail-copy pre{white-space:pre-wrap;word-break:break-word}.mail-copy a{color:#58778b}.mail-copy img{max-width:100%;height:auto}.artalk-mail-content img[atk-emoticon],.artalk-mail-content img.atk-emoticon{display:inline-block!important;height:2em!important;max-height:2em!important;width:auto!important;max-width:none!important;vertical-align:text-bottom!important;margin:0 .1em!important}
@media(max-width:480px){.mail-surround{padding:16px 8px!important}.mail-padding{padding-left:22px!important;padding-right:22px!important}.mail-heading{font-size:24px!important}.mail-art{width:82px!important}.mail-art img{width:82px!important;height:auto!important}.mail-copy{font-size:18px!important}}
@media(prefers-color-scheme: dark){body,.mail-canvas{background-color:#151719!important}.mail-card{background-color:#202326!important;border-color:#373d41!important}.mail-rule{border-color:#373d41!important}.mail-heading,.mail-copy,.mail-name{color:#e9edef!important}.mail-muted{color:#9ca8af!important}.mail-brand,.mail-copy a{color:#9bb6c6!important}.mail-comment{background-color:#191c1f!important;border-color:#9bb6c6!important}.mail-feedback{background-color:#282e30!important}.mail-feedback-label{color:#9fbdb7!important}.mail-button{background-color:#89a8ba!important;color:#15232b!important}.mail-motif-light{display:none!important}.mail-motif-dark{display:block!important;max-height:none!important;overflow:visible!important}.mail-category{color:#9bb6c6!important}}
</style></head>
<body class="mail-canvas" style="margin:0;padding:0;background-color:#f3f4f4">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all">{{reply_nick}} 回复了你在「{{page_title}}」的评论。</div>
<table class="mail-canvas artalk-mail-content" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;background-color:#f3f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif"><tr><td class="mail-surround" align="center" style="padding:28px 16px">
<!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
<table role="presentation" class="mail-card" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background-color:#fff;border:1px solid #e3e7e9;border-radius:9px;border-collapse:separate">
<tr><td class="mail-padding" style="padding:0 30px"><table class="mail-rule" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-bottom:1px solid #e3e7e9"><tr><td style="padding:24px 0;font-size:19px;line-height:29px;font-weight:600"><a class="mail-brand" href="{{site_url}}" style="color:#4e7188;text-decoration:none"><span style="display:inline-block;vertical-align:middle">微光集</span><span aria-hidden="true" style="display:inline-block;vertical-align:middle;margin-left:5px;font-size:23px;line-height:1;font-family:Arial,sans-serif;font-weight:400">✦</span></a></td><td class="mail-muted mail-category" align="right" style="font-size:15px;line-height:25px;color:#58778b">评论回复</td></tr></table></td></tr>
<tr><td class="mail-padding" style="padding:18px 30px 14px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td height="86" valign="middle" style="height:86px;padding-right:10px"><h1 class="mail-heading " style="margin:0;color:#25313a;font-size:26px;line-height:1.55;font-weight:600">你收到了新的回复</h1></td><td class="mail-art" width="142" valign="middle" style="width:142px;line-height:0"><span class="mail-motif-light" style="display:block;line-height:0"><img src="https://goblincwl.site/static/mail/comment-light-v1.png" width="142" height="86" alt="" style="display:block;width:142px;height:86px;border:0;margin:0"></span><span class="mail-motif-dark" style="display:none;max-height:0;overflow:hidden;mso-hide:all;line-height:0"><img src="https://goblincwl.site/static/mail/comment-dark-v1.png" width="142" height="86" alt="" style="display:block;width:142px;height:86px;border:0;margin:0"></span></td></tr></table></td></tr>
<tr><td class="mail-padding" style="padding:0 30px"><table class="mail-comment" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f7f8;border-left:1px solid #58778b;border-radius:0 5px 5px 0"><tr><td height="122" valign="top" style="padding:18px 20px"><p class="mail-muted" style="margin:0 0 10px;font-size:15px;line-height:21px;color:#75828b">{{reply_nick}} · 在「<a class="mail-muted" href="{{link_to_reply}}" style="color:#75828b;text-decoration:none">{{page_title}}</a>」</p><div class="mail-copy" style="font-size:18px;line-height:1.9;color:#25313a">{{reply_content}}</div></td></tr></table></td></tr>
<tr><td class="mail-padding" align="right" style="padding:24px 30px 30px;text-align:right"><a class="mail-button " href="{{link_to_reply}}" style="display:inline-block;padding:10px 18px;border-radius:4px;background-color:#466a80;color:#ffffff;font-size:16px;line-height:25px;font-weight:500;text-decoration:none;mso-padding-alt:10px 18px">查看并回复 &nbsp; →</a></td></tr>
<tr><td class="mail-padding" style="padding:0 30px"><div class="mail-rule mail-muted" style="border-top:1px solid #e3e7e9;padding:17px 0 19px;color:#75828b;font-size:14px;line-height:19px"><a class="mail-muted" href="{{site_url}}" style="color:#75828b;text-decoration:none">GoblinCwl 的微光集</a></div></td></tr>
</table><!--[if mso]></td></tr></table><![endif]-->
</td></tr></table></body></html>
