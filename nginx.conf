# 定义运行Nginx的用户，通常与容器内用户一致
user nginx;

# 工作进程数，通常设置为CPU核心数
worker_processes auto;

# 错误日志路径和级别
error_log /var/log/nginx/error.log warn;

# 存储主进程PID的文件
pid /var/run/nginx.pid;

# 事件模块配置
events {
    # 每个工作进程的最大连接数
    worker_connections 1024;
    # 使用高效的多路复用IO
    use epoll;
    # 开启多连接接受
    multi_accept on;
}

# HTTP模块配置
http {
    # 包含MIME类型定义
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志路径
    access_log /var/log/nginx/access.log main;

    # 基础优化设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 文本资源传输压缩：目录依赖的脚本和内容索引经前置代理返回时也启用。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
        application/xml text/xml image/svg+xml application/wasm;

    map $uri $player_asset_cache_control {
        default "";
        ~^/static/vendor/(artplayer/5\.4\.0|artplayer-plugin-danmuku/5\.2\.0|hls\.js/1\.6\.16|marked/15\.0\.12|dompurify/3\.2\.7|aplayer/1\.10\.1|mpegts\.js/1\.8\.0|asciinema-player/3\.17\.0|mermaid/11\.4\.0|ruffle/0\.5\.0)/ "public, max-age=31536000, immutable";
    }

    client_max_body_size 1G;

    # Quartz 静态资源与 Go 业务网关，供前置 HTTPS 反向代理访问。
    # Only trust the front HTTPS proxy for client IPs; direct requests cannot spoof X-Real-IP.
    set_real_ip_from nginx-proxy;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    server {
        listen 8080;
        server_name example.com;
        # 目录补斜杠等重定向使用相对地址，保留前置代理的 HTTPS 域名和端口。
        absolute_redirect off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $quartz_backend quartz-server:8080;

        # JitViewer 预览组件及资源：转发独立服务，清除访客凭据并关闭流式缓冲。
        location ^~ /jit-viewer/ {
            access_log off;
            proxy_pass http://jit-viewer:80/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 120s;
            add_header Referrer-Policy no-referrer always;
        }

        # 本站 API 与 RSS 统一入口：转交 Go 处理认证、方法限制、请求大小、限流和业务缓存。
        location ~ ^/(api/|index\.xml$) {
            proxy_pass http://$quartz_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Visitor-IP "";
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 150s;
            client_max_body_size 1m;
        }

        root /data/public/current;
        index index.html;
        error_page 403 /403.html;
        error_page 404 /_site_not_found;
        # 本站不存在的地址：直接访问、刷新和站内导航统一使用带左栏的 404。
        # 保留原请求地址及 HTTP 404；不替换供其他域名使用的独立错误页模板。
        location = /_site_not_found {
            internal;
            alias /data/public/current/static/site-404.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store" always;
            add_header X-Site-Error "404" always;
        }
        # 禁止访问错误页：读取独立持久化文件，不依赖页面构建发布。
        location = /403.html {
            alias /etc/nginx/site-errors/403.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store" always;
        }
        # 资源不存在错误页：读取独立持久化文件，关闭缓存以便及时更新。
        location = /404.html {
            alias /etc/nginx/site-errors/404.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store" always;
        }

        # Video 动态路由：统一返回视频页面壳，系列、视频及分集数据由前端加载。
        location ~ ^/Video(?:/|$) {
            try_files /Video/index.html =404;
            default_type text/html;
            charset utf-8;
        }
        
        # Repo 动态路由：统一返回仓库页面壳，语言、项目及代码路径由前端解析。
        location ~ ^/Repo(?:/|$) {
            try_files /Repo/index.html =404;
            default_type text/html;
            charset utf-8;
        }
        # 星枢页面入口：返回静态页面，并通知搜索引擎不收录。
        location = /observatory/ {
            try_files /observatory/index.html =404;
            default_type text/html;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        # Share 路由检查：由 Go 判断路径是否有效，命中后内部跳转至分享页面壳。
        location ~ ^/Share(?:/|$) {
            proxy_pass http://$quartz_backend/internal/share/route;
            proxy_set_header X-Drive-URI $request_uri;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_intercept_errors on;
        }
        # Share 内部页面壳：仅供 Go 的 X-Accel-Redirect 调用，不允许外部直接访问。
        location = /_drive_page_shell {
            internal;
            alias /data/public/current/Share/index.html;
            default_type text/html;
        }

        # 标签统一入口：星河页通过 tag 查询参数定位，不再提供独立筛选页。
        location /tags/ {
            try_files $uri $uri.html $uri/ =404;
        }

        # 字幕渲染资源：直接读取源码中的 libass/WASM，允许无凭据跨域并长期缓存。
        location ^~ /static/vendor/libass-wasm/ {
            root /data/quartz;
            try_files $uri =404;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            gzip_types application/javascript application/wasm;
        }

        # 源码静态资源：构建期间继续可用；未命中时回退到生成资源，版本化播放器资源长期缓存。
        location ^~ /static/ {
            root /data/quartz;
            try_files $uri @generated_static;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control $player_asset_cache_control;
        }

        # 生成资源回退：读取 current 指向的完整构建版本，未命中返回 404。
        location @generated_static {
            root /data/public/current;
            try_files $uri =404;
        }

        # 普通静态页面及文件：依次匹配原路径、HTML 和目录，均未命中则返回站点 404。
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
