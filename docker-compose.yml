name: quartz4
services:
  quartz:
    build:
      context: ./quartz
      network: host
    container_name: quartz4
    restart: unless-stopped
    volumes:
      - /home/goblincwl/docker/syncthing/data/syncthing/CwlLibrary:/usr/src/app/content:rw
      - ./quartz/quartz.config.ts:/usr/src/app/quartz.config.ts:ro
      - ./quartz/quartz.layout.ts:/usr/src/app/quartz.layout.ts:ro
      - ./quartz/quartz:/usr/src/app/quartz:rw
      - ./public:/usr/src/app/public:rw
      - ./runtime/errors:/run/quartz-errors:rw
      - ./runtime/chronicle:/run/quartz-chronicle:rw
      - ./runtime/events:/run/quartz-events:ro
    networks:
      - service_net
    environment:
      QUARTZ_EVENTS_SOCKET: /run/quartz-events/published.sock
      QUARTZ_ATOMIC_PUBLISH: "1"
      QUARTZ_ERROR_PAGES_DIR: /run/quartz-errors
      QUARTZ_JOURNAL_DIR: /run/quartz-chronicle
    command: ["node", "./quartz/bootstrap-cli.mjs", "build", "--watch"]

  artalk:
    container_name: artalk
    image: artalk/artalk-go
    restart: unless-stopped
    ports:
      - 23366:23366
    volumes:
      - ./artalk-data:/data
    environment:
      - TZ=Asia/Shanghai
      - ATK_LOCALE=zh-CN
      - ATK_SITE_DEFAULT=GoblinCwl 的微光集
      - ATK_SITE_URL=https://goblincwl.site
    networks:
      - service_net

  nginx:
    depends_on:
      server: {condition: service_healthy}
    image: nginx:alpine
    container_name: quartz-nginx
    restart: unless-stopped
    ports:
      - "10002:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/data/public:ro
      - ./quartz/quartz/static:/data/quartz/static:ro
      - ./runtime/errors:/etc/nginx/site-errors:ro
    networks:
      - service_net

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    container_name: quartz-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quartz
      MYSQL_USER: quartz
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./quartz-server/database/init.sql:/docker-entrypoint-initdb.d/001-quartz.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--skip-name-resolve"]
    networks: [backend, database-access]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "--host=127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      options: {max-size: "10m", max-file: "3"}

  server:
    build:
      context: ./quartz-server
      network: host
    image: quartz-server:local
    container_name: quartz-server
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HTTP_ADDR: :8080
      SITE_ORIGIN: https://goblincwl.site
      MYSQL_ADDR: mysql:3306
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      QUARTZ_EVENTS_SOCKET: /run/quartz-events/published.sock
      ARTICLE_DIRECTORY: /sources/notes
      PUBLIC_DIR: /public/current
      AUTH_DIR: /data/auth
      FRIEND_AVATAR_TEMP_DIR: /data/avatar-tmp
      TZ: Asia/Shanghai
    volumes:
      - ./runtime/server:/data:rw
      - ./runtime/events:/run/quartz-events:rw
      - ./runtime/chronicle:/snapshots:ro
      - ./public:/public:ro
      - /home/goblincwl/docker/syncthing/data/syncthing/CwlLibrary:/sources/notes:rw
      - /home/goblincwl/docker/openlist/data:/sources/openlist:ro
      - /home/goblincwl/docker/beszel/beszel_data:/sources/beszel:ro
      - /home/goblincwl/docker/jellyfin/config/data:/sources/jellyfin:ro
      - /home/goblincwl/docker/gitea/data/git/repositories:/sources/repositories:ro
      - /home/goblincwl/docker/gitea/github-sync-data:/sources/repo-catalog:ro
      - /home/goblincwl/docker/gitea/secrets:/sources/github-secret:rw
      - /home/goblincwl/docker/syncthing/data/syncthing/CwlLibrary/Private/日记:/sources/diaries:ro
    depends_on:
      mysql: {condition: service_healthy}
    networks:
      backend: {}
      service_net: {gw_priority: 1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
    logging:
      options: {max-size: "10m", max-file: "3"}

volumes:
  mysql-data:
    external: true
    name: quartz-server_mysql-data

networks:
  backend: {internal: true}
  database-access: {}
  service_net: {external: true}
