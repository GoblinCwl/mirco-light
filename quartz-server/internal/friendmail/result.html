<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark"><title>微光集 · 友链审核</title>
<style>
body{margin:0;padding:0}table{border-collapse:collapse}.mail-copy{overflow-wrap:anywhere;word-break:break-word}.mail-copy p{margin:0 0 12px}.mail-copy p:last-child{margin-bottom:0}.mail-copy pre{white-space:pre-wrap;word-break:break-word}.mail-copy a{color:#58778b}.mail-copy img{max-width:100%;height:auto}.artalk-mail-content img[atk-emoticon],.artalk-mail-content img.atk-emoticon{display:inline-block!important;height:2em!important;max-height:2em!important;width:auto!important;max-width:none!important;vertical-align:middle!important;margin:0 .1em!important}
@media(max-width:480px){.mail-surround{padding:16px 8px!important}.mail-padding{padding-left:22px!important;padding-right:22px!important}.mail-heading{font-size:24px!important}.mail-art{width:82px!important}.mail-art img{width:82px!important;height:auto!important}.mail-copy{font-size:18px!important}}
@media(prefers-color-scheme: dark){body,.mail-canvas{background-color:#151719!important}.mail-card{background-color:#202326!important;border-color:#373d41!important}.mail-rule{border-color:#373d41!important}.mail-heading,.mail-copy,.mail-name{color:#e9edef!important}.mail-muted{color:#9ca8af!important}.mail-brand,.mail-copy a{color:#9bb6c6!important}.mail-comment{background-color:#191c1f!important;border-color:#9bb6c6!important}.mail-feedback{background-color:#282e30!important}.mail-feedback-label{color:#9fbdb7!important}.mail-button{background-color:#89a8ba!important;color:#15232b!important}.mail-motif-light{display:none!important}.mail-motif-dark{display:block!important;max-height:none!important;overflow:visible!important}.mail-category{color:{{if .Accepted}}#a9bca5{{else}}#d59b8e{{end}}!important}.mail-result{color:{{if .Accepted}}#b1c9b4{{else}}#e0a79b{{end}}!important}.mail-friend-button{background-color:{{if .Accepted}}#89a8ba{{else}}#4a3531{{end}}!important;color:{{if .Accepted}}#15232b{{else}}#e7b9ae{{end}}!important}}
@media(max-width:355px){
  .mail-approved-site{width:146px!important}.mail-stamp-image{height:124px!important}
  .mail-stamp-avatar{width:124px!important;height:124px!important}.mail-approved-gap{width:10px!important}
}
@media(prefers-color-scheme: dark){
  .mail-approved-bubble{background-color:#202022!important;border-color:#393639!important;color:#ebebec!important}
  .mail-approved-tail{background-color:#202022!important;border-color:#393639!important}
  .mail-approved-clip{background-color:#202326!important}
  .mail-approved-site{background-color:#242a2d!important;border-color:#424d53!important}.mail-stamp-edge{background-color:#202326!important;background-image:none!important;border-color:#4c5760!important}.mail-stamp{background-color:#2a333a!important;border-color:#4c5760!important}.mail-stamp-head{border-color:#4c5760!important}.mail-stamp-image{background-color:#242c32!important}.mail-card-number,.mail-stamp-caption{color:#9bb6c6!important}.mail-postmark{color:#9bb6c6!important;border-color:#658091!important}
}
</style></head>
<body class="mail-canvas" style="margin:0;padding:0;background-color:#f3f4f4">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all">{{.Heading}}</div>
<table class="mail-canvas artalk-mail-content" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;background-color:#f3f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif"><tr><td class="mail-surround" align="center" style="padding:28px 16px">
<!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
<table role="presentation" class="mail-card" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background-color:#fff;border:1px solid #e3e7e9;border-radius:9px;border-collapse:separate">
<tr><td class="mail-padding" style="padding:0 30px"><table class="mail-rule" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-bottom:1px solid #e3e7e9"><tr><td style="padding:24px 0;font-size:19px;line-height:29px;font-weight:600"><a class="mail-brand" href="{{.SiteURL}}" style="color:#4e7188;text-decoration:none"><span style="display:inline-block;vertical-align:middle">微光集</span><span aria-hidden="true" style="display:inline-block;vertical-align:middle;margin-left:5px;font-size:23px;line-height:1;font-family:Arial,sans-serif;font-weight:400">✦</span></a></td><td class="mail-muted mail-category" align="right" style="font-size:15px;line-height:25px;color:{{if .Accepted}}#657d5e{{else}}#aa5b4d{{end}}">友链审核</td></tr></table></td></tr>
<tr><td class="mail-padding" style="padding:18px 30px 14px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td height="86" valign="middle" style="height:86px;padding-right:10px"><h1 class="mail-heading mail-result" style="margin:0;color:{{if .Accepted}}#587d61{{else}}#a45346{{end}};font-size:26px;line-height:1.55;font-weight:600">{{.Heading}}</h1></td><td class="mail-art" width="142" valign="middle" style="width:142px;line-height:0">{{if .Accepted}}<span class="mail-motif-light" style="display:block;line-height:0"><img src="https://goblincwl.site/static/mail/friends-approved-light-v1.png" width="142" height="86" alt="" style="display:block;width:142px;height:86px;border:0;margin:0"></span><span class="mail-motif-dark" style="display:none;max-height:0;overflow:hidden;mso-hide:all;line-height:0"><img src="https://goblincwl.site/static/mail/friends-approved-dark-v1.png" width="142" height="86" alt="" style="display:block;width:142px;height:86px;border:0;margin:0"></span>{{else}}<span class="mail-motif-light" style="display:block;line-height:0"><img src="https://goblincwl.site/static/mail/friends-declined-light-v1.png" width="142" height="86" alt="" style="display:block;width:142px;height:86px;border:0;margin:0"></span><span class="mail-motif-dark" style="display:none;max-height:0;overflow:hidden;mso-hide:all;line-height:0"><img src="https://goblincwl.site/static/mail/friends-declined-dark-v1.png" width="142" height="86" alt="" style="display:block;width:142px;height:86px;border:0;margin:0"></span>{{end}}</td></tr></table></td></tr>
{{if .Accepted}}
{{template "approved-card" .}}
{{else}}
<tr><td class="mail-padding" style="padding:0 30px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td height="122" valign="top" style="padding:5px 0 0"><p class="mail-name" style="margin:0 0 13px;font-size:20px;line-height:25px;color:#25313a;font-weight:500">{{.Name}}</p><div class="mail-copy" style="font-size:18px;line-height:1.9;color:#25313a;white-space:pre-wrap">{{.Reason}}</div></td></tr></table></td></tr>
{{end}}
<tr><td class="mail-padding"{{if ne .Kind "friends-removed"}} align="right"{{end}} style="padding:24px 30px 30px{{if ne .Kind "friends-removed"}};text-align:right{{end}}"><a class="mail-button mail-friend-button" href="{{.FriendsURL}}" style="display:inline-block;padding:10px 18px;border-radius:4px;background-color:{{if .Accepted}}#466a80{{else}}#f2e2dd{{end}};color:{{if .Accepted}}#ffffff{{else}}#914d41{{end}};font-size:16px;line-height:25px;font-weight:500;text-decoration:none;mso-padding-alt:10px 18px">{{if .Accepted}}查看友链{{else}}返回微光集{{end}} &nbsp; →</a></td></tr>
<tr><td class="mail-padding" style="padding:0 30px"><div class="mail-rule mail-muted" style="border-top:1px solid #e3e7e9;padding:17px 0 19px;color:#75828b;font-size:14px;line-height:19px"><a class="mail-muted" href="{{.SiteURL}}" style="color:#75828b;text-decoration:none">GoblinCwl 的微光集</a></div></td></tr>
</table><!--[if mso]></td></tr></table><![endif]-->
</td></tr></table></body></html>
